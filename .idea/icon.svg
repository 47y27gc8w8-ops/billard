<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Billard</title>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A5530"/>
      <stop offset="0.55" stop-color="#5A321A"/>
      <stop offset="1" stop-color="#2E170A"/>
    </linearGradient>
    <radialGradient id="cloth" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#1C9A6E"/>
      <stop offset="0.5" stop-color="#0F6E4F"/>
      <stop offset="1" stop-color="#063524"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#5A6068"/>
      <stop offset="0.28" stop-color="#202328"/>
      <stop offset="0.75" stop-color="#08090A"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F4F1E8"/>
      <stop offset="1" stop-color="#D9D3C4"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bounce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#1C9A6E" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C9A6E" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="ballClip"><circle cx="256" cy="246" r="152"/></clipPath>
  </defs>

  <!-- Table: wooden rail around a lamp-lit cloth -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#rail)"/>
  <rect x="44" y="44" width="424" height="424" rx="86" fill="url(#cloth)"/>
  <rect x="44" y="44" width="424" height="424" rx="86" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Ball shadow on the cloth -->
  <ellipse cx="276" cy="398" rx="150" ry="44" fill="url(#shadow)"/>

  <!-- The 8-ball -->
  <circle cx="256" cy="246" r="152" fill="url(#ball)"/>
  <rect x="96" y="90" width="320" height="310" fill="url(#bounce)" clip-path="url(#ballClip)"/>
  <g transform="rotate(-18 228 214)">
    <ellipse cx="228" cy="214" rx="74" ry="70" fill="url(#disc)"/>
    <!-- "8" as two stroked loops, so no font is needed -->
    <g fill="none" stroke="#15171A" stroke-width="15">
      <ellipse cx="228" cy="188" rx="21" ry="19"/>
      <ellipse cx="228" cy="236" rx="27" ry="25"/>
    </g>
  </g>
  <ellipse cx="190" cy="148" rx="46" ry="26" transform="rotate(-35 190 148)" fill="url(#gloss)"/>
</svg>
